name: Source preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/test-requirements.txt
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPython3_EXECUTABLE="$(Get-Command python | Select-Object -ExpandProperty Source)"
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix dist
